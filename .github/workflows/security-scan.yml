name: Security scan

on:
  # GitHub Actions cron is wall-clock; "*/2" fires on days 1,3,5,...,31, which
  # is close to every 48h but slips at month boundaries. Good enough for a
  # scheduled vulnerability watch; trigger manually via workflow_dispatch
  # whenever you want an on-demand run.
  schedule:
    - cron: '0 9 */2 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run npm audit
        run: |
          npm audit --json > audit.json || true
          echo "::group::Raw npm audit"
          jq '.metadata' audit.json
          echo "::endgroup::"

      - name: Extract dependency findings
        run: |
          jq -r '
            .vulnerabilities // {}
            | to_entries[]
            | .key as $pkg
            | (.value.via // [])
            | map(select(type == "object"))[]
            | [
                $pkg,
                (.url // ""),
                (.title // ""),
                (.severity // "info"),
                ((.cvss.score // 0) | tostring),
                (.range // "")
              ]
            | @tsv
          ' audit.json > findings.tsv
          echo "::group::Findings"
          cat findings.tsv || true
          echo "::endgroup::"

      - name: Static checks (secrets, dangerouslySetInnerHTML, headers)
        run: |
          : > static.tsv
          # 1) hardcoded secrets outside supabase/config.toml env() refs
          if grep -RInE 'API_KEY|SECRET|TOKEN|PASSWORD|service_role|\bsk-[A-Za-z0-9]{20,}|\bpk_[A-Za-z0-9]{20,}' \
                --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' \
                --include='*.json' --include='*.env*' --include='*.yml' --include='*.yaml' \
                --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.next \
                . 2>/dev/null | grep -v 'env(' | head -20 > /tmp/secrets.txt; then
            while read -r line; do
              printf 'F-AUTO-SEC\thigh\tPossible hardcoded secret\t%s\n' "$line" >> static.tsv
            done < /tmp/secrets.txt
          fi
          # 2) new dangerouslySetInnerHTML uses
          if grep -RIn 'dangerouslySetInnerHTML' \
                --include='*.jsx' --include='*.tsx' \
                --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.next \
                . 2>/dev/null > /tmp/dsih.txt; then
            while read -r line; do
              printf 'F-AUTO-XSS\tlow\tdangerouslySetInnerHTML usage\t%s\n' "$line" >> static.tsv
            done < /tmp/dsih.txt
          fi
          # 3) missing poweredByHeader/headers in next.config.mjs
          if [ -f next.config.mjs ] && ! grep -q 'poweredByHeader' next.config.mjs; then
            printf 'F-AUTO-HDR\tmedium\tnext.config.mjs missing poweredByHeader=false\tnext.config.mjs\n' >> static.tsv
          fi
          if [ -f next.config.mjs ] && ! grep -q 'headers()' next.config.mjs; then
            printf 'F-AUTO-CSP\tmedium\tnext.config.mjs missing headers() with CSP/X-Frame-Options\tnext.config.mjs\n' >> static.tsv
          fi
          echo "::group::Static findings"
          cat static.tsv || true
          echo "::endgroup::"

      - name: Load existing open security issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list \
            --label security --state open \
            --json number,title,body --limit 200 \
            --repo "$GITHUB_REPOSITORY" > existing.json
          jq 'length' existing.json

      - name: File new dependency findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          filed=0
          skipped=0
          while IFS=$'\t' read -r pkg url title severity cvss range; do
            [ -z "$url" ] && continue
            # Dedupe by GHSA URL appearing in any open security issue body
            if jq -e --arg u "$url" 'any(.[]; .body | contains($u))' existing.json > /dev/null; then
              skipped=$((skipped+1))
              continue
            fi
            case "$severity" in
              critical) sev_label="severity:critical" ;;
              high)     sev_label="severity:high" ;;
              moderate) sev_label="severity:medium" ;;
              low)      sev_label="severity:low" ;;
              *)        sev_label="severity:info" ;;
            esac
            body=$(cat <<BODY
**Source:** automated scheduled scan (\`.github/workflows/security-scan.yml\`)
**Run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
**Package:** \`${pkg}\`
**Advisory:** ${url}
**Severity:** ${severity} (CVSS ${cvss})
**Vulnerable range:** \`${range}\`

## Title
${title}

## Fix
\`\`\`bash
npm audit fix
# or upgrade the package directly:
npm install ${pkg}@latest
\`\`\`

_This issue was filed automatically. Close it manually once the advisory no longer reproduces in \`npm audit\`._
BODY
)
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "[AUTO] ${severity} (${pkg}): ${title}" \
              --label "security,automated,${sev_label},area:dependency" \
              --body "$body"
            filed=$((filed+1))
          done < findings.tsv
          echo "FILED_DEP=$filed"   >> "$GITHUB_ENV"
          echo "SKIPPED_DEP=$skipped" >> "$GITHUB_ENV"

      - name: File new static-check findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          filed=0
          skipped=0
          while IFS=$'\t' read -r fid severity title evidence; do
            [ -z "$fid" ] && continue
            # Dedupe by finding-ID appearing in any open security issue title
            if jq -e --arg t "$fid" 'any(.[]; .title | contains($t))' existing.json > /dev/null; then
              skipped=$((skipped+1))
              continue
            fi
            case "$severity" in
              critical) sev_label="severity:critical" ;;
              high)     sev_label="severity:high" ;;
              medium)   sev_label="severity:medium" ;;
              low)      sev_label="severity:low" ;;
              *)        sev_label="severity:info" ;;
            esac
            body=$(cat <<BODY
**Source:** automated scheduled scan (\`.github/workflows/security-scan.yml\`)
**Run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
**Finding ID:** ${fid}
**Severity:** ${severity}

## Evidence
\`\`\`
${evidence}
\`\`\`

_This issue was filed automatically. Close it manually once resolved._
BODY
)
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "[${fid}] ${severity}: ${title}" \
              --label "security,automated,${sev_label},area:application" \
              --body "$body"
            filed=$((filed+1))
          done < static.tsv
          echo "FILED_STATIC=$filed"   >> "$GITHUB_ENV"
          echo "SKIPPED_STATIC=$skipped" >> "$GITHUB_ENV"

      - name: Comment on resolved issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          resolved=0
          # Iterate every open security issue body; if it carries a GHSA URL
          # and that URL is NOT in today's findings, mark it likely-resolved.
          jq -c '.[]' existing.json | while read -r row; do
            num=$(echo "$row" | jq -r '.number')
            body=$(echo "$row" | jq -r '.body // ""')
            ghsa=$(echo "$body" | grep -oE 'https://github.com/advisories/GHSA-[a-z0-9-]+' | head -1)
            [ -z "$ghsa" ] && continue
            if ! grep -qF "$ghsa" findings.tsv; then
              # Avoid double-commenting: skip if last comment already says "resolved"
              last=$(gh issue view "$num" --repo "$GITHUB_REPOSITORY" --json comments \
                     --jq '.comments[-1].body // ""' 2>/dev/null || echo "")
              if echo "$last" | grep -q 'no longer reproduces'; then
                continue
              fi
              gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body \
                "Scheduled scan at $(date -u +%FT%TZ) — advisory $ghsa no longer reproduces in \`npm audit\`. Likely resolved; leaving open for human verification (close manually after confirming)."
              resolved=$((resolved+1))
            fi
          done
          echo "RESOLVED=$resolved" >> "$GITHUB_ENV"

      - name: Summary
        run: |
          {
            echo "## Security scan summary"
            echo ""
            echo "| Metric | Count |"
            echo "|---|---|"
            echo "| New dependency issues filed | ${FILED_DEP:-0} |"
            echo "| New static-check issues filed | ${FILED_STATIC:-0} |"
            echo "| Already-tracked (skipped) | $(( ${SKIPPED_DEP:-0} + ${SKIPPED_STATIC:-0} )) |"
            echo "| Resolved-comments posted | ${RESOLVED:-0} |"
          } >> "$GITHUB_STEP_SUMMARY"
